<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitacion San Valentin</title>
    <link rel="icon" href="heart.ico" type="image/x-icon">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css">
  </head>
  <body class="center">
    <!-- Todos los textos, fotos y links se editan en contenido.json; aquí solo van variables -->
    <template id="plantilla">
    <div class="content">
      <!-- Header-->
      <section class="header">
        <div class="hero">
          <img src="{{portada.foto}}" alt="{{portada.fotoAlt}}">
          <h1>{{portada.nombres}}</h1>
          <h3 class="fecha">{{portada.fecha}}</h3>
          <p>{{portada.frase}}</p>
        </div>
      </section>

      <!-- Divisor Love -->
      <div class="divisorLove">
        <h1>
          {{divisor.linea1}} <br>
          {{divisor.linea2}}
          <div class="nada"></div>
        </h1>
      </div>

      <!-- Pre Info -->
      <div class="pre-info">
        <h1 class="p-titulo">{{presentacion.titulo}}</h1>
        <p class="p-frase">{{presentacion.frase}}</p>
      </div>

      <div class="separadorInfo">
        <h1 class="s-titulo">{{separadores.titulo1}}</h1>
        <img src="{{separadores.foto1}}" alt="{{separadores.foto1Alt}}">
      </div>

      <div class="contador">
        <div class="titulo-contador">
          <h1>{{cuentaRegresiva.titulo}}</h1>
        </div>
        <div class="contador-container">
          <ul class="date-time">
            <li>
              <div class="time_number" id="dias"></div>
              <div class="time_txt">{{cuentaRegresiva.dias}}</div>
            </li>
            <li>
              <div class="time_number" id="horas"></div>
              <div class="time_txt">{{cuentaRegresiva.horas}}</div>
            </li>
            <li>
              <div class="time_number" id="minutos"></div>
              <div class="time_txt">{{cuentaRegresiva.minutos}}</div>
            </li>
            <li>
              <div class="time_number" id="segundos"></div>
              <div class="time_txt">{{cuentaRegresiva.segundos}}</div>
            </li>
          </ul>
        </div>
      </div>

      <!-- Calendario -->
      <section class="calendario-evento">
        <h1 class="calendario-titulo">{{calendario.titulo}}</h1>

        <p class="calendario-frase">{{calendario.frase}}</p>

        <div class="calendario-card">
          <div class="cal-header">
            <span id="calendarioMes"></span>
            <h2 id="calendarioAnio"></h2>
          </div>

          <div class="dias-semana">{{calendario.diasSemana}}</div>

          <div class="dias-mes" id="calendarioDias"></div>
        </div>

        <button class="agendar-btn" id="calendarioBoton">{{calendario.boton}}</button>
      </section>

      <!-- info -->
      <div class="info">
        <h1>{{ubicaciones.titulo}}</h1>

        <div class="imagen-ceremonia">
          <p>{{ubicaciones.ceremoniaTexto}}</p>

          <img src="{{ubicaciones.ceremoniaFoto}}" alt="">

          <button class="ubicacion" onclick="window.open('{{ubicaciones.ceremoniaMapa}}', '_blank')">{{ubicaciones.ceremoniaBoton}}</button>
        </div>

        <div class="imagen-ceremonia">
          <p>{{ubicaciones.recepcionTexto}}</p>

          <img src="{{ubicaciones.recepcionFoto}}" alt="">

          <button class="ubicacion" onclick="window.open('{{ubicaciones.recepcionMapa}}', '_blank')">{{ubicaciones.recepcionBoton}}</button>
        </div>
      </div>

      <div class="padres-padrinos">
        <h1>{{familia.titulo}}</h1>
        <p>{{familia.texto}}</p>

        <div class="lista-padres-padrinos">
          {{#familia.grupos}}
          <ul>
            <li>{{titulo}}</li>
            <li>{{nombre1}}</li>
            <li>{{nombre2}}</li>
          </ul>
          {{/familia.grupos}}

          
        </div>
      </div>

      <div class="separadorInfo">
        <h1 class="s-titulo">{{separadores.titulo2}}</h1>
        <img src="{{separadores.foto2}}" alt="{{separadores.foto2Alt}}">
      </div>

      <!-- Cronograma -->
      <section class="cronograma">
        <h1 class="cronograma-titulo">{{cronograma.titulo}}</h1>

        <p class="cronograma-frase">{{cronograma.frase}}</p>

        <div class="timeline">
          {{#cronograma.actividades}}
          <div class="evento">
            <div class="hora">{{hora}}</div>

            <div class="linea">
              <span></span>
            </div>

            <div class="contenido">
              <h2>{{actividad}}</h2>
              <p>{{lugar}}</p>
            </div>
          </div>
          {{/cronograma.actividades}}

          

          

          

          
        </div>
      </section>

      <div class="detalles">
        <h1>{{detalles.titulo}}</h1>
        <div class="codigo-vestimenta">
          <h2>{{detalles.vestimentaTitulo}}</h2>
          <p>{{detalles.vestimentaTexto}}</p>
        </div>

        <div class="mesa-regalos">
          <h2>{{detalles.regalosTitulo}}</h2>
          <p>
            {{detalles.regalosTexto1}}
            <a href="{{detalles.regalosLink}}" target="_blank">{{detalles.regalosLinkTexto}}</a>
            {{detalles.regalosTexto2}}
          </p>
        </div>

        <div class="puntualidad">
          <h2>{{detalles.puntualidadTitulo}}</h2>
          <p>{{detalles.puntualidadTexto}}</p>
        </div>

        <div class="niños">
          <h2>{{detalles.ninosTitulo}}</h2>
          <p>{{detalles.ninosTexto}}</p>
        </div>

        <div class="confirmar">
          <h2>{{detalles.confirmarTitulo}}</h2>
          <p>
            {{detalles.confirmarTexto1}}
            <a href="{{detalles.confirmarLink}}">{{detalles.confirmarLinkTexto}}</a>{{detalles.confirmarTexto2}}
          </p>

          <div class="boton-confirmar">
            <button class="confirmar-asistencia">{{detalles.confirmarBoton}}</button>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <footer>
        {{footer.texto}}
        <a href="{{footer.link}}" target="_blank">{{footer.marca}}</a>
        {{footer.anio}}
      </footer>
    </div>

      <script src="assets/js/main.js"></script>
    </template>

    <script src="assets/js/motor.js"></script>
  </body>
</html>
